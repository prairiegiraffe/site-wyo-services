<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WYO Services | Links</title>
  <meta name="description" content="WYO Services — Multi-service oilfield contractor serving the Powder River Basin since 2012.">
  <link rel="icon" type="image/png" href="https://devtools.prairiegiraffe.com/api/projects/proj_x2c0miif/sites/56/serve/assets/favicon-black-5f5dab4d58d0.png">
  <style>
    @font-face {
      font-family: "Tactic Sans Ext";
      src: url("fonts/tactic-sans-extended-black.woff2") format("woff2");
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Open Sauce Sans";
      src: url("fonts/OpenSauceSans-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Open Sauce Sans";
      src: url("fonts/OpenSauceSans-SemiBold.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Open Sauce Sans";
      src: url("fonts/OpenSauceSans-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar { display: none; }

    body {
      font-family: "Open Sauce Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem 3rem;
      color: #f5f5f7;
      background: #000;
      background-image: url('https://devtools.prairiegiraffe.com/api/projects/proj_x2c0miif/sites/56/serve/assets/fencing-hero-atv-wire-6b9be9e0e56f.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      position: relative;
    }

    /* Dark overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
    }

    .link-hub {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 2;
    }

    /* Header */
    .link-hub__header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .link-hub__logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 1rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border: 2px solid rgba(255,255,255,0.15);
    }
    .link-hub__logo img {
      width: 80%;
      height: auto;
      object-fit: contain;
    }
    .link-hub__title {
      font-family: "Tactic Sans Ext", "Open Sauce Sans", system-ui, sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1.2;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      color: #fff;
    }
    .link-hub__tagline {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.5;
      opacity: 0.7;
      max-width: 320px;
      margin: 0 auto;
      color: #fff;
    }

    /* Phone */
    .link-hub__phone {
      text-align: center;
      margin-bottom: 1.25rem;
    }
    .link-hub__phone a {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .link-hub__phone a:hover { opacity: 0.8; }
    .link-hub__phone svg {
      width: 18px;
      height: 18px;
      color: #EA743D;
      flex-shrink: 0;
    }

    /* Buttons */
    .link-hub__buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .link-btn {
      animation: fadeInUp 0.4s ease forwards;
      opacity: 0;
    }
    .link-btn a {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 1.25rem 0 6px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      transition: transform 0.15s, box-shadow 0.15s;
      overflow: hidden;
    }
    .link-btn a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
    .link-btn a:active {
      transform: translateY(0);
    }
    .link-btn__icon {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .link-btn__icon svg {
      width: 20px;
      height: 20px;
    }
    .link-btn__label {
      flex: 1;
      text-align: center;
      padding: 0.85rem 0.75rem;
      font-family: "Tactic Sans Ext", "Open Sauce Sans", system-ui, sans-serif;
    }

    /* CTA style — orange bg */
    .link-btn--cta a {
      background: #EA743D;
      color: #ffffff;
      border: none;
    }

    /* Default style — dark with border */
    .link-btn--default a {
      background: rgba(0,0,0,0.7);
      color: #ffffff;
      border: 1.5px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Footer */
    .link-hub__footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.75rem;
      opacity: 0.4;
    }
    .link-hub__footer a {
      color: inherit;
      text-decoration: none;
    }
    .link-hub__footer a:hover {
      opacity: 0.8;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
